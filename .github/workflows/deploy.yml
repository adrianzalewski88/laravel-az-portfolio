name: Deploy AZ Portfolio Source

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: laravel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "${{ secrets.LINODE_SSH_KEY }}" > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.LINODE_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Laravel application
        run: |
          ssh "${{ secrets.LINODE_USER }}@${{ secrets.LINODE_HOST }}" << 'EOF'
            set -e

            cd /var/www/html/portfolio-source.adrian-zalewski.com/public_html

            echo "Fetching latest main branch..."
            git fetch origin main

            echo "Resetting production code..."
            git reset --hard origin/main

            echo "Installing production dependencies..."
            composer install \
              --no-dev \
              --prefer-dist \
              --optimize-autoloader

            echo "Running database migrations..."
            php artisan migrate --force

            echo "Ensuring Passport encryption keys exist..."
            if [ ! -f storage/oauth-private.key ] || [ ! -f storage/oauth-public.key ]; then
              php artisan passport:keys
            fi

            echo "Clearing application caches..."
            php artisan optimize:clear

            echo "Building production caches..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "Laravel deployment completed."
          EOF