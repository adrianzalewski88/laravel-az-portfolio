services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: az-portfolio-source-app
    ports:
      - "8000:80"
      - "5174:5174"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: az_portfolio
      DB_USERNAME: az_portfolio
      DB_PASSWORD: az_portfolio
    networks:
      - az-portfolio

  mysql:
    image: mysql:8.4
    container_name: az-portfolio-source-mysql
    environment:
      MYSQL_DATABASE: az_portfolio
      MYSQL_USER: az_portfolio
      MYSQL_PASSWORD: az_portfolio
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - az-portfolio

volumes:
  mysql_data:

networks:
  az-portfolio:
    driver: bridge
